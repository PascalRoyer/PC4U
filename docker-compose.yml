version: "3.8"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pc4u-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Pc4uStrongPass#2025"
      MSSQL_PID: "Express"
    ports:
      - "1500:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pc4u-api
    environment:
      PORT: 8080
      DB_SERVER: db
      DB_PORT: 1433
      DB_NAME: PC4U
      DB_USER: sa
      DB_PASSWORD: "Pc4uStrongPass#2025"
      JWT_SECRET: "Pc4uSuperSecret2025!"
      JWT_EXPIRES: 2h
    depends_on:
      - db
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pc4u-web
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  mssql-data:
