<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>PC4U – Configurateur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style/style.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="header-brand" href="./index.html">
          <img src="./assets/img/log3.png" alt="Logo PC4U" />
          <span>PC4U</span>
        </a>
        <nav class="nav">
          <a href="./products.html">Produits</a>
          <a href="./login.html">Connexion</a>
          <a href="./register.html">Inscription</a>
        </nav>
      </div>
    </header>

   <main class="configurator">
      <section class="intro">
        <h1>Bienvenue sur le configurateur PC4U</h1>
        <p>Sélectionne les composants pour créer ton PC sur mesure.</p>
      </section>

      <section class="table-section">
        <h2>Choisis tes pièces</h2>

        <table class="config-table">
          <thead>
            <tr>
              <th>Composant</th>
              <th>Sélection</th>
              <th>Prix</th>
            </tr>
          </thead>

          <tbody>
            <tr data-component="cpu">
              <td>CPU</td>
              <td>
                <div class="option-group">
                  <button class="select-btn" data-price="0">None</button>
                  <button class="select-btn" data-price="250">Intel i5</button>
                  <button class="select-btn" data-price="350">Intel i7</button>
                  <button class="select-btn" data-price="450">Intel i9</button>
                </div>
              </td>
              <td class="price">$0</td>
            </tr>

            <tr data-component="gpu">
              <td>GPU</td>
              <td>
                <div class="option-group">
                  <button class="select-btn" data-price="0">None</button>
                  <button class="select-btn" data-price="400">RTX 4060</button>
                  <button class="select-btn" data-price="700">RTX 4070</button>
                  <button class="select-btn" data-price="1000">RTX 4080</button>
                </div>
              </td>
              <td class="price">$0</td>
            </tr>

            <tr data-component="ram">
              <td>RAM</td>
              <td>
                <div class="option-group">
                  <button class="select-btn" data-price="0">None</button>
                  <button class="select-btn" data-price="50">8 Go</button>
                  <button class="select-btn" data-price="100">16 Go</button>
                  <button class="select-btn" data-price="180">32 Go</button>
                </div>
              </td>
              <td class="price">$0</td>
            </tr>

            <tr data-component="ssd">
              <td>Stockage SSD</td>
              <td>
                <div class="option-group">
                  <button class="select-btn" data-price="0">None</button>
                  <button class="select-btn" data-price="80">512 Go</button>
                  <button class="select-btn" data-price="120">1 To</button>
                  <button class="select-btn" data-price="200">2 To</button>
                </div>
              </td>
              <td class="price">$0</td>
            </tr>

            <tr data-component="os">
              <td>Windows 11</td>
              <td>
                <div class="option-group">
                  <button class="select-btn" data-price="0">None</button>
                  <button class="select-btn" data-price="120">Famille</button>
                  <button class="select-btn" data-price="180">Pro</button>
                </div>
              </td>
              <td class="price">$0</td>
            </tr>
          </tbody>
        </table>

        <div class="total">
          <strong>Total :</strong> <span id="total-price">0 $</span>
        </div>
      </section>
    </main>

    <footer>© PC4U — Tous droits réservés.</footer>

    <script>
     

      const buttons = document.querySelectorAll(".select-btn");
      const totalPriceEl = document.getElementById("total-price");

      function updateTotal() {
        let total = 0;
        document.querySelectorAll("tr[data-component]").forEach(row => {
          const active = row.querySelector(".select-btn.active");
          if (active) {
            total += parseFloat(active.dataset.price);
            row.querySelector(".price").textContent = active.dataset.price + " $";
          } else {
            row.querySelector(".price").textContent = "$0";
          }
        });

        totalPriceEl.textContent = total.toFixed(2) + " $";
        totalPriceEl.classList.add("glow");
        setTimeout(() => totalPriceEl.classList.remove("glow"), 400);
      }

      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          const group = btn.closest(".option-group");
          group.querySelectorAll(".select-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          updateTotal();
        });
      });
    </script>
  </body>
</html>
