<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>PC4U – Configurateur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/style_build.css" />
  </head>

  <body>
    <!-- Modal pour afficher les templates -->
    <div id="templates-modal" class="modal hidden">
      <div class="modal-content">
        <span id="close-modal" class="close-btn">&times;</span>
        <h3>Templates</h3>
        <div id="templates-container"></div>
      </div>
    </div>

    <header class="site-header">
      <div class="header-inner">
        <a class="header-brand" href="./index.html">
          <img src="./assets/img/log3.png" alt="PC4U" />
        </a>
        <nav class="nav">
          <a href="./build.html">Configurateur</a>
          <a href="./products.html">Produits</a>
          <a href="./Shopping-cart.html">Panier</a>
          <a href="./login.html">Log in</a>
          <a href="./register.html">Register</a>
        </nav>
      </div>
    </header>

    <main class="configurator">
      <section class="intro">
        <h1>Bienvenue au configurateur PC4U</h1>
        <p>Sélectionne les composants pour créer ton PC sur mesure.</p>
      </section>

      <section class="table-section">
        <h2>Choisis tes pièces</h2>
        <div class="template-buttons">
          <button id="show-templates-btn" class="template-btn">
            📂 Voir les templates
          </button>
          <button id="save-template-btn" class="template-btn">
            ➕ Ajouter un template
          </button>
        </div>
        <button reset class="template-btn" onclick="location.reload();">🔄 Réinitialiser</button>


        <table class="config-table">
          <thead>
            <tr>
              <th>Composant</th>
              <th>Sélection</th>
              <th>Prix</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>

        <div class="total">
          <strong>Total :</strong> <span id="total-price">0 $</span>
        </div>
        <div class="table-actions" style="text-align: center; margin-top: 14px">
          <button id="add-to-cart-btn" class="template-btn">
            🛒 Ajouter au panier
          </button>
        </div>
      </section>
    </main>

    <footer>© PC4U — Tous droits réservés.</footer>

    <script>
/* -------------------------------------------
   CATEGORIES venant de la base de données
------------------------------------------- */
const dbCategoryMap = {
  cpu: 'CPU',
  motherboard: 'Motherboards',
  ram: 'Memory_RAM',
  storage: 'Storage',
  gpu: 'GPU',
  psu: 'Power_supply',
  case: 'Cases'
};

/* -------------------------------------------
   COMPOSANTS LOCAUX (pas dans la DB)
------------------------------------------- */
const componentsDB = {
  cooler: [
    { name: 'Cooler Master Hyper 212', price: 45 },
    { name: 'Noctua NH-D15', price: 120 },
    { name: 'NZXT Kraken X63', price: 180 }
  ],
  os: [
    { name: 'Windows 11 Home', price: 139 },
    { name: 'Windows 11 Pro', price: 199 }
  ]
};

/* -------------------------------------------
   LISTE DES TYPES DE COMPOSANTS
------------------------------------------- */
const componentList = {
  cpu: { label: "CPU", icon: "./assets/img/build/CPU.png" },
  motherboard: { label: "Carte mère", icon: "./assets/img/build/Motherboard.png" },
  ram: { label: "RAM", icon: "./assets/img/build/RAM.png" },
  storage: { label: "Stockage", icon: "./assets/img/build/SSD.png" },
  gpu: { label: "GPU", icon: "./assets/img/build/GPU.png" },
  psu: { label: "Alimentation", icon: "./assets/img/build/PSU.png" },
  case: { label: "Boîtier", icon: "./assets/img/build/Case.png" },
  cooler: { label: "Refroidissement", icon: "./assets/img/build/cooling.png" },
  os: { label: "Système d'exploitation", icon: "./assets/img/build/os.png" }
};

/* -------------------------------------------
   UTILISATEUR CONNECTÉ (pour les templates)
------------------------------------------- */
function getUserIdForTemplates() {
  const keys = ["user_id_number", "user_id", "id", "userId"];
  for (const key of keys) {
    const v = localStorage.getItem(key);
    if (v) return Number(v);
  }
  return 1; // fallback DEV
}

/* -------------------------------------------
   RÉCUPÉRATION DU BUILD ACTUEL
------------------------------------------- */
function getCurrentBuild() {
  const build = { components: {}, total: 0 };
  document.querySelectorAll("tr[data-component]").forEach(row => {
    const key = row.dataset.component;
    const select = row.querySelector(".component-select");
    const opt = select.options[select.selectedIndex];

    // IMPORTANT : on prend le texte (nom du produit), pas la value
    const name = opt?.textContent || "Aucun";
    const price = Number(opt?.dataset.price || 0);

    build.components[key] = { name, price };
    build.total += price;
  });
  return build;
}

/* -------------------------------------------
   AJOUT AU PANIER
------------------------------------------- */
function addToCartAndRedirect() {
  const build = getCurrentBuild();
  const ok = Object.values(build.components).some(c => c.price > 0);
  if (!ok) {
    alert("Sélectionnez au moins un composant !");
    return;
  }
  const cart = JSON.parse(localStorage.getItem("pc4u_cart") || "[]");
  cart.push({ id: Date.now(), ...build });
  localStorage.setItem("pc4u_cart", JSON.stringify(cart));
  window.location.href = "./Shopping-cart.html";
}

const addToCartStaticBtn = document.getElementById("add-to-cart-btn");
if (addToCartStaticBtn) {
  addToCartStaticBtn.addEventListener("click", addToCartAndRedirect);
}

/* -------------------------------------------
   GÉNÉRATION DES LIGNES DU TABLEAU
------------------------------------------- */
function generateRows() {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  for (const key in componentList) {
    const c = componentList[key];
    const row = document.createElement("tr");
    row.dataset.component = key;
    row.innerHTML = `
      <td>
        <img src="${c.icon}" class="icon-build"> ${c.label}
      </td>
      <td>
        <input
          type="text"
          class="component-search"
          data-component="${key}"
          placeholder="Rechercher un ${c.label}..."
          style="width:100%; margin-bottom:6px;"
        />
        <select class="component-select" data-component="${key}">
          <option value="" data-price="0">Ajouter ${c.label}...</option>
        </select>
      </td>
      <td class="price">$0</td>
    `;
    tbody.appendChild(row);
  }
}

/* -------------------------------------------
   CHARGER LES PRODUITS DE LA DB POUR UN TYPE
------------------------------------------- */
async function fetchProductsForComponent(key) {
  const category = dbCategoryMap[key];
  // pas de catégorie DB -> on utilisera les données locales
  if (!category) {
    return (componentsDB[key] || []).map(item => ({
      id: null,
      name: item.name,
      price: item.price || 0
    }));
  }

  try {
    const res = await fetch(
      `/api/products/configurator?category=${encodeURIComponent(category)}`,
      { credentials: "include" }
    );
    const data = await res.json();
    if (!res.ok) throw data;

    // on normalise
    return data.map(p => ({
      id: p.product_id,
      name: p.product_name,
      price: Number(p.product_price) || 0
    }));
  } catch (err) {
    console.error("Erreur chargement produits configurateur", key, err);
    alert("Impossible de charger les produits du configurateur.");
    return [];
  }
}

/* -------------------------------------------
   INITIALISATION DES SELECTS
------------------------------------------- */
async function initDropdowns() {
  const selects = document.querySelectorAll(".component-select");

  for (const select of selects) {
    const key = select.dataset.component;
    const items = await fetchProductsForComponent(key);

    items.forEach(i => {
      const opt = document.createElement("option");
      opt.value = i.id != null ? String(i.id) : i.name; // id si DB, sinon nom
      opt.textContent = i.name;                         // seulement le nom
      opt.dataset.price = i.price ?? 0;
      select.appendChild(opt);
    });

    select.onchange = () => {
      const p = Number(select.options[select.selectedIndex].dataset.price || 0);
      select.closest("tr").querySelector(".price").textContent = `$${p}`;
      updateTotal();
    };
  }
}

/* -------------------------------------------
   RECHERCHE DANS LES LISTES
------------------------------------------- */
function initSearchInputs() {
  document.querySelectorAll(".component-search").forEach(input => {
    const compKey = input.dataset.component;
    const select = document.querySelector(
      `select.component-select[data-component="${compKey}"]`
    );

    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase();
      let firstMatchIndex = 0;

      Array.from(select.options).forEach((opt, idx) => {
        if (idx === 0) return; // on garde "Ajouter ..."

        const text = opt.textContent.toLowerCase();
        const match = !q || text.includes(q);

        opt.hidden = !match;

        if (q && match && firstMatchIndex === 0) {
          firstMatchIndex = idx;
        }
      });

      if (q && firstMatchIndex > 0) {
        select.selectedIndex = firstMatchIndex;
        select.dispatchEvent(new Event("change"));
      }

      if (!q) {
        Array.from(select.options).forEach(opt => (opt.hidden = false));
        select.selectedIndex = 0;
        select.dispatchEvent(new Event("change"));
      }
    });
  });
}

/* -------------------------------------------
   TOTAL
------------------------------------------- */
function updateTotal() {
  let t = 0;
  document.querySelectorAll(".price").forEach(p => {
    t += Number(p.textContent.replace("$", "").trim() || 0);
  });
  document.getElementById("total-price").textContent = `${t} $`;
}

/* -------------------------------------------
   SAUVEGARDE TEMPLATE
------------------------------------------- */
document.getElementById("save-template-btn").onclick = async () => {
  const userId = getUserIdForTemplates();
  const build = getCurrentBuild();
  const name = prompt("Nom du template :", "Mon PC");
  if (!name) return;

  try {
    const res = await fetch("/api/prebuilt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        templateName: name,
        user_id_number: userId,
        components: Object.entries(build.components)
          .filter(([_, c]) => c.price > 0)
          .map(([n, c]) => ({
            component_name: n,
            selected_option: c.name, // on stocke le nom
            price: c.price
          }))
      })
    });

    const out = await res.json();
    if (!res.ok) throw out;
    alert("✅ Template enregistré !");
  } catch (err) {
    console.error(err);
    alert("❌ Erreur : Impossible de créer le template");
  }
};

/* -------------------------------------------
   AFFICHER LES TEMPLATES
------------------------------------------- */
document.getElementById("show-templates-btn").onclick = async () => {
  const modal = document.getElementById("templates-modal");
  const container = document.getElementById("templates-container");

  try {
    const res = await fetch("/api/prebuilt", { credentials: "include" });
    const data = await res.json();
    if (!res.ok) throw data;

    modal.classList.remove("hidden");
    container.innerHTML = data.length ? "" : "<p>Aucun template enregistré.</p>";

    data.forEach(t => {
      container.insertAdjacentHTML(
        "beforeend",
        `
        <div class="template-item">
          <strong>${t.template_name}</strong> — ${t.total_price} $
          <button class="load-template-btn" data-id="${t.template_id}">Charger</button>
          <button class="delete-template-btn" data-id="${t.template_id}">🗑 Supprimer</button>
        </div>
      `
      );
    });

    initLoadButtons();
    initDeleteButtons();
  } catch (err) {
    console.error(err);
    alert("❌ Erreur : Impossible de charger les templates");
  }
};

/* -------------------------------------------
   CHARGEMENT TEMPLATE
------------------------------------------- */
function initLoadButtons() {
  document.querySelectorAll(".load-template-btn").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const res = await fetch(`/api/prebuilt/${id}`, { credentials: "include" });
      const tpl = await res.json();
      if (!res.ok) {
        alert("❌ Impossible de charger le template");
        return;
      }

      const map = {};
      tpl.components.forEach(c => {
        map[c.component_name] = {
          selected: c.selected_option,
          price: c.price
        };
      });

      applyTemplateToUI(map);
      document.getElementById("templates-modal").classList.add("hidden");
    };
  });
}

/* -------------------------------------------
   SUPPRESSION TEMPLATE
------------------------------------------- */
function initDeleteButtons() {
  document.querySelectorAll(".delete-template-btn").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Voulez-vous vraiment supprimer ce template ?")) return;

      const id = btn.dataset.id;

      try {
        const res = await fetch(`/api/prebuilt/${id}`, {
          method: "DELETE",
          credentials: "include"
        });

        const out = await res.json();
        if (!res.ok) throw out;

        btn.parentElement.remove();
        alert("🗑 Template supprimé !");
      } catch (err) {
        console.error(err);
        alert("❌ Erreur : Impossible de supprimer le template");
      }
    };
  });
}

/* -------------------------------------------
   APPLIQUER TEMPLATE DANS LE UI
------------------------------------------- */
function applyTemplateToUI(components) {
  document.querySelectorAll("tr[data-component]").forEach(row => {
    const c = components[row.dataset.component];
    if (!c) return;

    const select = row.querySelector("select");
    Array.from(select.options).forEach((opt, i) => {
      // on compare avec le texte (nom du produit)
      if (opt.textContent === c.selected) {
        select.selectedIndex = i;
        row.querySelector(".price").textContent = `$${c.price}`;
      }
    });
  });
  updateTotal();
}

/* -------------------------------------------
   INIT
------------------------------------------- */
generateRows();
initDropdowns().then(() => {
  initSearchInputs();
  updateTotal();
});

document.getElementById("close-modal").onclick = () =>
  document.getElementById("templates-modal").classList.add("hidden");
</script>



  </body>
</html>
