<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>PC4U – Configurateur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="stylesheet" href="./style/style_build.css"/>
  </head>
  
  <!-- Modal pour afficher les templates -->
  <div id="templates-modal" class="modal hidden">
    <div class="modal-content">
      <span id="close-modal" class="close-btn">&times;</span>
      <h3>Templates</h3>
      <div id="templates-container"></div>
    </div>
  </div>

  <body>

    <header class="site-header">
      <div class="header-inner">
        <a class="header-brand" href="./index.html">
          <img src="./assets/img/log3.png" alt="Logo PC4U" />
        </a>
        <nav class="nav">
          <a href="./products.html">Produits</a>
          <a href="./login.html">Connexion</a>
          <a href="./register.html">Inscription</a>
        </nav>
      </div>
    </header>


    


    <main class="configurator">
      <section class="intro">
        <h1>Bienvenue au configurateur PC4U</h1>
        <p>Sélectionne les composants pour créer ton PC sur mesure.</p>
      </section>
      
      <section class="table-section">
        <h2>Choisis tes pièces</h2>
        <div class="template-buttons">
          <button id="show-templates-btn" class="template-btn">📂 Voir les templates</button>
          <button id="save-template-btn" class="template-btn">➕ Ajouter un template</button>
        </div>
        
        <table class="config-table">
          <thead>
            <tr>
              <th>Composant</th>
              <th>Sélection</th>
              <th>Prix</th>
            </tr>
          </thead>
          <tbody id="tableBody">
         </tbody>
        </table>

        <div class="total">
          <strong>Total :</strong> <span id="total-price">0 $</span>
        </div>
      </section>
    </main>
    
   
    

 

    

    <footer>© PC4U — Tous droits réservés.</footer>

          <script>
/* -------------------------------------------
   BASE DE DONNÉES LOCALE DES COMPOSANTS
------------------------------------------- */
const componentsDB = {
  cpu: [
    { name: 'Intel Core i9-13900K', price: 589 },
    { name: 'AMD Ryzen 9 7950X', price: 549 },
    { name: 'Intel Core i7-13700K', price: 409 },
    { name: 'AMD Ryzen 7 7700X', price: 349 },
    { name: 'Intel Core i5-13600K', price: 319 }
  ],
  gpu: [
    { name: 'NVIDIA RTX 4090', price: 1599 },
    { name: 'NVIDIA RTX 4080', price: 1199 },
    { name: 'AMD Radeon RX 7900 XTX', price: 999 },
    { name: 'NVIDIA RTX 4070 Ti', price: 799 },
    { name: 'AMD Radeon RX 7900 XT', price: 849 }
  ],
  ram: [
    { name: 'Corsair Vengeance 32GB DDR5', price: 159 },
    { name: 'G.Skill Trident Z5 32GB DDR5', price: 169 },
    { name: 'Kingston Fury 16GB DDR5', price: 89 },
    { name: 'Corsair Dominator 64GB DDR5', price: 329 }
  ],
  ssd: [
    { name: 'Samsung 990 Pro 2TB', price: 189 },
    { name: 'WD Black SN850X 2TB', price: 179 },
    { name: 'Samsung 980 Pro 1TB', price: 99 },
    { name: 'Crucial P5 Plus 2TB', price: 149 }
  ],
  os: [
    { name: 'Windows 11 Home', price: 139 },
    { name: 'Windows 11 Pro', price: 199 }
  ],
  case: [
    { name: 'NZXT H510 Elite', price: 149 },
    { name: 'Corsair 4000D Airflow', price: 104 },
    { name: 'Lian Li O11 Dynamic', price: 139 },
    { name: 'Fractal Design Meshify C', price: 89 }
  ],
  monitor: [
    { name: 'ASUS ROG Swift 27" 1440p 165Hz', price: 449 },
    { name: 'LG UltraGear 24" 1080p 144Hz', price: 249 },
    { name: 'Samsung Odyssey G7 32" 1440p 240Hz', price: 699 },
    { name: 'Dell S2721DGF 27" 1440p 165Hz', price: 429 }
  ],
  keyboard: [
    { name: 'Corsair K70 RGB', price: 169 },
    { name: 'Logitech G915 TKL', price: 229 },
    { name: 'Razer BlackWidow V3', price: 139 },
    { name: 'Keychron K8', price: 89 }
  ],
  mouse: [
    { name: 'Logitech G Pro X Superlight', price: 159 },
    { name: 'Razer DeathAdder V3', price: 69 },
    { name: 'SteelSeries Rival 3', price: 29 },
    { name: 'Corsair Dark Core RGB', price: 89 }
  ]
};

/* -------------------------------------------
   LISTE DES TYPES DE COMPOSANTS
------------------------------------------- */
const componentList = {
  cpu: { label: "CPU", icon: "./assets/img/build/CPU.png" },
  motherboard: { label: "Carte mère", icon: "./assets/img/build/Motherboard.png" },
  ram: { label: "RAM", icon: "./assets/img/build/RAM.png" },
  storage: { label: "Stockage", icon: "./assets/img/build/SSD.png" },
  gpu: { label: "GPU", icon: "./assets/img/build/GPU.png" },
  psu: { label: "Alimentation", icon: "./assets/img/build/PSU.png" },
  case: { label: "Boîtier", icon: "./assets/img/build/Case.png" },
  cooler: { label: "Refroidissement", icon: "./assets/img/build/cooling.png" },
  os: { label: "Système d'exploitation", icon: "./assets/img/build/os.png" },
};

/* -------------------------------------------
   UTILISATEUR CONNECTÉ
------------------------------------------- */
function getUserIdForTemplates() {
  const keys = ["user_id_number", "user_id", "id", "userId"];
  for (const key of keys) {
    const v = localStorage.getItem(key);
    if (v) return Number(v);
  }
  return 1; // fallback DEV
}

/* -------------------------------------------
   RÉCUPÉRATION DU BUILD ACTUEL
------------------------------------------- */
function getCurrentBuild() {
  const build = { components: {}, total: 0 };
  document.querySelectorAll("tr[data-component]").forEach(row => {
    const key = row.dataset.component;
    const select = row.querySelector(".component-select");
    const opt = select.options[select.selectedIndex];
    const name = opt?.value || "Aucun";
    const price = Number(opt?.dataset.price || 0);
    build.components[key] = { name, price };
    build.total += price;
  });
  return build;
}

/* -------------------------------------------
   AJOUT AU PANIER
------------------------------------------- */
function addToCartAndRedirect() {
  const build = getCurrentBuild();
  const ok = Object.values(build.components).some(c => c.price > 0);
  if (!ok) return alert("Sélectionnez au moins un composant !");
  const cart = JSON.parse(localStorage.getItem("pc4u_cart") || "[]");
  cart.push({ id: Date.now(), ...build });
  localStorage.setItem("pc4u_cart", JSON.stringify(cart));
  window.location.href = "./Shopping-cart.html";
}

const addBtn = document.createElement("button");
addBtn.textContent = "Ajouter au panier";
addBtn.className = "template-btn";
addBtn.onclick = addToCartAndRedirect;
document.querySelector(".template-buttons").appendChild(addBtn);

/* -------------------------------------------
   GÉNÉRATION DES LIGNES DU TABLEAU
------------------------------------------- */
function generateRows() {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  for (const key in componentList) {
    const c = componentList[key];
    const row = document.createElement("tr");
    row.dataset.component = key;
    row.innerHTML = `
      <td><img src="${c.icon}" class="icon-build"> ${c.label}</td>
      <td><select class="component-select" data-component="${key}">
            <option value="" data-price="0">Ajouter ${c.label}...</option>
          </select>
      </td>
      <td class="price">$0</td>`;
    tbody.appendChild(row);
  }
}

/* -------------------------------------------
   INITIALISATION DES SELECTS
------------------------------------------- */
function initDropdowns() {
  document.querySelectorAll(".component-select").forEach(select => {
    const items = componentsDB[select.dataset.component];
    if (items) {
      items.forEach(i => {
        const opt = document.createElement("option");
        opt.value = i.name;
        opt.textContent = i.name;
        opt.dataset.price = i.price;
        select.appendChild(opt);
      });
    }

    select.onchange = () => {
      const p = Number(select.options[select.selectedIndex].dataset.price);
      select.closest("tr").querySelector(".price").textContent = `$${p}`;
      updateTotal();
    };
  });
}

/* -------------------------------------------
   TOTAL
------------------------------------------- */
function updateTotal() {
  let t = 0;
  document.querySelectorAll(".price").forEach(p => {
    t += Number(p.textContent.replace("$",""));
  });
  document.getElementById("total-price").textContent = `${t} $`;
}

/* -------------------------------------------
   SAUVEGARDE TEMPLATE
------------------------------------------- */
document.getElementById("save-template-btn").onclick = async () => {
  const userId = getUserIdForTemplates();

  const build = getCurrentBuild();
  const name = prompt("Nom du template :", "Mon PC");
  if (!name) return;

  try {
    const res = await fetch("/api/prebuilt", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        templateName: name,
        user_id_number: userId,
        components: Object.entries(build.components)
          .filter(([_, c]) => c.price > 0)
          .map(([n, c]) => ({ component_name: n, selected_option: c.name, price: c.price }))
      })
    });

    const out = await res.json();
    if (!res.ok) throw out;
    alert("✅ Template enregistré !");
  } catch (err) {
    alert("❌ Erreur : Impossible de créer le template");
  }
};

/* -------------------------------------------
   AFFICHER LES TEMPLATES
------------------------------------------- */
document.getElementById("show-templates-btn").onclick = async () => {
  const modal = document.getElementById("templates-modal");
  const container = document.getElementById("templates-container");

  try {
    const res = await fetch("/api/prebuilt", { credentials: "include" });
    const data = await res.json();
    if (!res.ok) throw data;

    modal.classList.remove("hidden");
    container.innerHTML = data.length ? "" : "<p>Aucun template enregistré.</p>";

    data.forEach(t => {
      container.insertAdjacentHTML("beforeend", `
        <div class="template-item">
          <strong>${t.template_name}</strong> — ${t.total_price} $
          <button class="load-template-btn" data-id="${t.template_id}">Charger</button>
          <button class="delete-template-btn" data-id="${t.template_id}">🗑 Supprimer</button>
        </div>
      `);
    });

    initLoadButtons();
    initDeleteButtons();

  } catch (err) {
    alert("❌ Erreur : Impossible de charger les templates");
  }
};

/* -------------------------------------------
   CHARGEMENT TEMPLATE
------------------------------------------- */
function initLoadButtons() {
  document.querySelectorAll(".load-template-btn").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const res = await fetch(`/api/prebuilt/${id}`, { credentials: "include" });
      const tpl = await res.json();
      if (!res.ok) return alert("❌ Impossible de charger le template");

      const map = {};
      tpl.components.forEach(c => map[c.component_name] = { selected: c.selected_option, price: c.price });

      applyTemplateToUI(map);
      document.getElementById("templates-modal").classList.add("hidden");
    };
  });
}

/* -------------------------------------------
   SUPPRESSION TEMPLATE
------------------------------------------- */
function initDeleteButtons() {
  document.querySelectorAll(".delete-template-btn").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Voulez-vous vraiment supprimer ce template ?")) return;

      const id = btn.dataset.id;

      try {
        const res = await fetch(`/api/prebuilt/${id}`, {
          method: "DELETE",
          credentials: "include"
        });

        const out = await res.json();
        if (!res.ok) throw out;

        btn.parentElement.remove();
        alert("🗑 Template supprimé !");
      } catch (err) {
        alert("❌ Erreur : Impossible de supprimer le template");
      }
    };
  });
}

/* -------------------------------------------
   APPLIQUER TEMPLATE DANS LE UI
------------------------------------------- */
function applyTemplateToUI(components) {
  document.querySelectorAll("tr[data-component]").forEach(row => {
    const c = components[row.dataset.component];
    if (!c) return;

    const select = row.querySelector("select");
    [...select.options].forEach((opt,i)=>{
      if (opt.value === c.selected) {
        select.selectedIndex = i;
        row.querySelector(".price").textContent = `$${c.price}`;
      }
    });
  });
  updateTotal();
}

/* -------------------------------------------
   INIT
------------------------------------------- */
generateRows();
initDropdowns();
updateTotal();

document.getElementById("close-modal").onclick = () =>
  document.getElementById("templates-modal").classList.add("hidden");
</script>


  </body>
</html>
