<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PC4U – Produits</title>
  <link rel="stylesheet" href="./style/style.css" />
</head>
<body>
 <header class="site-header">
    <div class="header-inner">
      <a class="header-brand" href="./index.html">
        <img src="./assets/img/log3.png" alt="PC4U" />
        
      </a>
      <nav class="nav">
       <nav class="nav">
        <a href="./build.html">Configurateur</a>
        <a href="./products.html">Produits</a>
        <a href="./Shopping-cart.html">Panier</a>
        <a href="./login.html">Log in</a>
        <a href="./register.html">Register</a>
        
      </nav>
      </nav>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher un produit..." />
  </div>

  <main>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <footer>© <span id="year"></span> PC4U — Tous droits réservés.</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const datasetFiles = [
      "case.json"
    //   "case-accessory.json",
    //   "case-fan.json",
    //   "cpu.json",
    //   "cpu-cooler.json",
    //   "memory.json",
    //   "motherboard.json",
    //   "monitor.json",
    //   "mouse.json",
    //   "keyboard.json",
    //   "video-card.json",
    //   "power-supply.json",
    //   "os.json",
    //   "external-hard-drive.json",
    //   "internal-hard-drive.json",
    //   "sound-card.json",
    //   "speakers.json",
    //   "headphones.json",
    //   "thermal-paste.json",
    //   "ups.json",
    //   "fan-controller.json",
    //   "optical-drive.json",
    //   "webcam.json",
    //   "wired-network-card.json",
    //   "wireless-network-card.json"
    // les autres fichiers sont commentés pour l'instant car le fichier est trop volumineux
    ];

    const productGrid = document.getElementById('productGrid');
    let allProducts = [];

    async function loadProducts() {
      for (const file of datasetFiles) {
        try {
          const res = await fetch(`./dataset/${file}`);
          if (!res.ok) continue;
          const data = await res.json();
          // Chaque fichier JSON peut contenir un tableau de produits
          allProducts = allProducts.concat(data);
        } catch (err) {
          console.error("Erreur fichier", file, err);
        }
      }
      displayProducts(allProducts);
    }

    function displayProducts(list) {
      productGrid.innerHTML = '';
      list.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img src="${prod.image || './assets/img/default.png'}" alt="${prod.name}" />
          <h3>${prod.name || prod.title || "Produit"}</h3>
          <p>${prod.category || prod.type || ""}</p>
          <div class="price">${prod.price ? prod.price + " $" : "—"}</div>
          <button class="btn btn-primary">Ajouter</button>
        `;
        productGrid.appendChild(card);
      });
    }

    // Recherche
    const searchInput = document.getElementById('searchInput');
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const filtered = allProducts.filter(p =>
        (p.name && p.name.toLowerCase().includes(query)) ||
        (p.category && p.category.toLowerCase().includes(query))
      );
      displayProducts(filtered);
    });

    loadProducts();
  </script>
</body>
</html>
