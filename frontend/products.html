  <script>
    const productGrid     = document.getElementById('productGrid');
    const searchInput     = document.getElementById('searchInput');
    const yearSpan        = document.getElementById('year');
    const categoryFilter  = document.getElementById('categoryFilter');
    const minPriceInput   = document.getElementById('minPrice');
    const maxPriceInput   = document.getElementById('maxPrice');
    const filterGroups    = document.querySelectorAll('.filter-group')
    const applyBtn        = document.getElementById('applyFilters');
    const resetBtn        = document.getElementById('resetFilters');

    let allProducts    = [];
    let currentFiltered = [];

    document.addEventListener('DOMContentLoaded', async () => {
      // année dans le footer
      if (yearSpan) yearSpan.textContent = new Date().getFullYear();

      // protection : obligé d’être connecté
      if (window.PC4UAuth && PC4UAuth.requireAuth) {
        await PC4UAuth.requireAuth();
      }

      // header login/logout
      setupHeaderAuthUI();
      //cacher les filtres spécifiques au début
      updateCategoryFilterUI();
      // chargement initial
      await loadProducts();

      // recherche texte
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          const q = searchInput.value.toLowerCase();
          const base = currentFiltered.length ? currentFiltered : allProducts;

          const filtered = base.filter(p =>
            (p.product_name  && p.product_name.toLowerCase().includes(q)) ||
            (p.category_name && p.category_name.toLowerCase().includes(q))
          );

          displayProducts(filtered);
        });
      }

      //Montrer/Cacher des filtres
      if (categoryFilter) {
        categoryFilter.addEventListener('change', () => {
          updateCategoryFilterUI();
        })
      }
      // bouton "Appliquer les filtres"
      if (applyBtn) {
        applyBtn.addEventListener('click', async () => {
          await applyFilters();
        });
      }

      // bouton "Réinitialiser"
      if (resetBtn) {
        resetBtn.addEventListener('click', async () => {
          if (categoryFilter) categoryFilter.value = "";
          if (minPriceInput)  minPriceInput.value  = "";
          if (maxPriceInput)  maxPriceInput.value  = "";
          if (searchInput)    searchInput.value    = "";

          filterGroups.forEach(g => {
            g.querySelectorAll('input,select').forEach(el => {
              if (el.type === 'checkbox' || el.type === 'radio') {
                el.checked = false;
              } else {
                el.value = "";
              }
            });
          });
          updateCategoryFilterUI();
          currentFiltered = [];
          await loadProducts();
        });
      }
    });

    function updateCategoryFilterUI() {
      const cat = categoryFilter ? categoryFilter.value : "";
      filterGroups.forEach(group => {
        const target = group.getAttribute('data-category');
        if (!cat || cat !== target) {
          group.style.display = 'none';
        } else {
          group.style.display = 'block';
        }
      });
    }

    function setupHeaderAuthUI() {
      const user = window.PC4UAuth && PC4UAuth.getCurrentUser
        ? PC4UAuth.getCurrentUser()
        : null;

      const loginLink    = document.getElementById('nav-login');
      const registerLink = document.getElementById('nav-register');
      const logoutBtn    = document.getElementById('nav-logout');

      if (user) {
        if (loginLink)    loginLink.style.display = 'none';
        if (registerLink) registerLink.style.display = 'none';
        if (logoutBtn) {
          logoutBtn.style.display = 'inline-block';
          logoutBtn.addEventListener('click', () => {
            PC4UAuth.logout();
          });
        }
      } else {
        if (logoutBtn) logoutBtn.style.display = 'none';
      }
    }

    async function loadProducts() {
      try {
        const base = (window.PC4UAuth && PC4UAuth.API_BASE) || 'http://localhost:8080';
        const res  = await fetch(`${base}/api/products`);

        if (!res.ok) throw new Error('Erreur serveur lors du chargement des produits');

        allProducts    = await res.json();
        currentFiltered = [];
        displayProducts(allProducts);
      } catch (err) {
        console.error('Erreur produits:', err);
        if (productGrid) {
          productGrid.innerHTML = `<p style="color:red">${err.message}</p>`;
        }
      }
    }

    async function applyFilters() {
      try {
        const base = (window.PC4UAuth && PC4UAuth.API_BASE) || 'http://localhost:8080';
        const params = new URLSearchParams();

        const cat = categoryFilter.value;
        const minP = minPriceInput.value;
        const maxP = maxPriceInput.value;

        if (cat) params.set('category', cat);
        if (minP) params.set('minPrice', minP);
        if (maxP) params.set('maxPrice', maxP);

        //filtres selon la catégorie
        if (cat === 'CPU') {
          const corecount = document.getElementById('corecount').value;
          const coreclock = document.getElementById('coreclock').value;
          const boostclock = document.getElementById('boostclock').value;
          const microarchitecture = document.getElementById('microarchitecture').value;
          const tdp = document.getElementById('tdp').value;
          const graphics = document.getElementById('graphics').value;

          if(corecount) params.set('corecount', corecount);
          if(coreclock) params.set('coreclock', coreclock);
          if(boostclock) params.set('boostclock', boostclock);
          if(microarchitecture) params.set('microarchitecture', microarchitecture);
          if(tdp) params.set('tdp', tdp);
          if(graphics) params.set('graphics', graphics);
        }
        
        if (cat === 'GPU') {
          const memory = document.getElementById('memory').value;
          const mcoreclock = document.getElementById('mcoreclock').value;
          const mboostclock = document.getElementById('mboostclock').value;
          const length = document.getElementById('length').value;

          if(memory) params.set('memory', memory);
          if(mcoreclock) params.set('mcoreclock', mcoreclock);
          if(mboostclock) params.set('mboostclock', mboostclock);
          if(length) params.set('length', length);
        }

        if (cat === 'Monitors') {
          const screensize = document.getElementById('screensize').value;
          const resolution = document.getElementById('resolution').value;
          const refreshrate = document.getElementById('refreshrate').value;
          const responsetime = document.getElementById('responsetime').value;
          const paneltype = document.getElementById('paneltype').value;
          const aspectratio = document.getElementById('aspectratio').value;

          if(screensize) params.set('screensize', screensize);
          if(resolution) params.set('resolution', resolution);
          if(refreshrate) params.set('refreshrate', refreshrate);
          if(responsetime) params.set('responsetime', responsetime);
          if(paneltype) params.set('paneltype', paneltype);
          if(aspectratio) params.set('aspectratio', aspectratio);
        }

        if (cat === 'Memory_RAM') {
          const speed = document.getElementById('speed').value;
          const modules = document.getElementById('modules').value;
          const firstwordlat = document.getElementById('firstwordlat').value;
          const caslat = document.getElementById('caslat').value;

          if(speed) params.set('speed', speed);
          if(modules) params.set('modules', modules);
          if(firstwordlat) params.set('firstwordlat', firstwordlat);
          if(caslat) params.set('caslat', caslat);
        }

        if (cat === 'Storage') {
          const hddtype = document.getElementById('hddtype').value;
          const interface = document.getElementById('interface').value;
          const capacity = document.getElementById('capacity').value;

          if(hddtype) params.set('hddtype', hddtype);
          if(interface) params.set('interface', interface);
          if(capacity) params.set('capacity', capacity);
        }

        if (cat === 'Power_supply') {
          const pstype = document.getElementById('pstype').value;
          const efficiency = document.getElementById('efficiency').value;
          const wattage = document.getElementById('wattage').value;
          const modular = document.getElementById('modular').value;

          if(pstype) params.set('pstype', pstype);
          if(efficiency) params.set('efficiency', efficiency);
          if(wattage) params.set('wattage', wattage);
          if(modular) params.set('modular', modular);
        }

        if (cat === 'Cases') {
          const casetype = document.getElementById('casetype').value;
          const sidepanel = document.getElementById('sidepanel').value;
          const externalvol = document.getElementById('externalvol').value;
          const internal35bays = document.getElementById('internal35bays').value;

          if(casetype) params.set('casetype', casetype);
          if(sidepanel) params.set('sidepanel', sidepanel);
          if(externalvol) params.set('externalvol', externalvol);
          if(internal35bays) params.set('internal35bays', internal35bays);
        }

        if (cat === 'Motherboards') {
          const socket = document.getElementById('socket').value;
          const formfactor = document.getElementById('formfactor').value;
          const maxmemory = document.getElementById('maxmemory').value;
          const memoryslots = document.getElementById('memoryslots').value;

          if(socket) params.set('socket', socket);
          if(formfactor) params.set('formfactor', formfactor);
          if(maxmemory) params.set('maxmemory', maxmemory);
          if(memoryslots) params.set('memoryslots', memoryslots);
        }
        
        const url = `${base}/api/products/filter?${params.toString()}`;
        const res = await fetch(url);
        
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error("Erreur serveur lors de l'application des filtres");
        }
        const data = await res.json();
        currentFiltered = data;
        displayProducts(data);
      } catch (err) {
        console.error('Erreur filtres:', err);
        if (productGrid) {
          productGrid.innerHTML = `<p style="color:red">${err.message}</p>`;
        }
      }
    }

    function displayProducts(list) {
      if (!productGrid) return;

      if (!Array.isArray(list) || list.length === 0) {
        productGrid.innerHTML = '<p>Aucun produit trouvé.</p>';
        return;
      }

      productGrid.innerHTML = '';

      list.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const priceText =
          prod.product_price != null
            ? `${Number(prod.product_price).toFixed(2)} $`
            : '—';

        const categoryText = prod.category_name || '';

        card.innerHTML = `
          <img src="${prod.image_url || './assets/img/default.png'}" alt="${prod.product_name}" />
          <h3>
            <a href="./productdetail.html?id=${prod.product_id}">
              ${prod.product_name}
            </a>
          </h3>
          <p>${categoryText}</p>
          <div class="price">${priceText}</div>
          <button class="btn btn-primary btn-add-cart" data-product-id="${prod.product_id}">Ajouter</button>
        `;

        productGrid.appendChild(card);
      });
    }
    async function addToCart(productId) {
      try {
        const token = (window.PC4UAuth && PC4UAuth.getToken && PC4UAuth.getToken()) ||
          localStorage.getItem('pc4u_token');

        if (!token) {
          alert('Connectez-vous pour ajouter des produits au panier.');
          window.location.href = './login.html';
          return;
        }
        const base = (window.PC4UAuth && PC4UAuth.API_BASE) || 'http://localhost:8080';

        const res = await fetch(`${base}/api/cart`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            product_id: productId,
            quantity: 1
          })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Erreur lors de l’ajout au panier');
        }
        alert('Produit ajouté au panier');
      } catch (err) {
        console.error('addToCart error:', err);
        alert(err.message);
      }
    }
    if (productGrid) {
      productGrid.addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-add-cart');
        if (!btn) return;

        const productId = Number(btn.dataset.productId);
        if (!productId) return;

        addToCart(productId);
      });
    }
  </script>

</body>
</html>
