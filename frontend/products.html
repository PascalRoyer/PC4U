<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PC4U – Produits</title>
  <link rel="stylesheet" href="./style/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="header-brand" href="./index.html">
        <img src="./assets/img/log3.png" alt="Logo PC4U" />
        <span>PC4U</span>
      </a>
      <nav class="nav">
        <a href="./index.html">Accueil</a>
        <a href="./build.html">Configurateur</a>
        <a href="./products.html" aria-current="page">Produits</a>
        <a href="./login.html">Connexion</a>
        <a href="./register.html">Inscription</a>
      </nav>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher un produit..." />
  </div>

  <main>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <footer>© <span id="year"></span> PC4U — Tous droits réservés.</footer>

  <script src="./js/auth.js"></script>
  <script>
    const productGrid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');
    const yearSpan = document.getElementById('year');
    let allProducts = [];

    document.addEventListener('DOMContentLoaded', async () => {
      // année
      if (yearSpan) yearSpan.textContent = new Date().getFullYear();

      // protection : redirection vers login si pas connecté
      if (window.PC4UAuth && PC4UAuth.requireAuth) {
        await PC4UAuth.requireAuth();
      }

      // gérer le header (login / logout)
      setupHeaderAuthUI();

      // charger les produits
      await loadProducts();

      // recherche
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          const q = searchInput.value.toLowerCase();
          const filtered = allProducts.filter(p =>
            (p.product_name && p.product_name.toLowerCase().includes(q)) ||
            (p.category_name && p.category_name.toLowerCase().includes(q))
          );
          displayProducts(filtered);
        });
      }
    });

    function setupHeaderAuthUI() {
      const user = window.PC4UAuth && PC4UAuth.getCurrentUser
        ? PC4UAuth.getCurrentUser()
        : null;

      const loginLink = document.getElementById('nav-login');
      const registerLink = document.getElementById('nav-register');
      const logoutBtn = document.getElementById('nav-logout');

      if (user) {
        if (loginLink) loginLink.style.display = 'none';
        if (registerLink) registerLink.style.display = 'none';
        if (logoutBtn) {
          logoutBtn.style.display = 'inline-block';
          logoutBtn.addEventListener('click', () => {
            PC4UAuth.logout();
          });
        }
      } else {
        if (logoutBtn) logoutBtn.style.display = 'none';
      }
    }

    async function loadProducts() {
      try {
        const base = (window.PC4UAuth && PC4UAuth.API_BASE) || 'http://localhost:8080';
        const res = await fetch(`${base}/api/products`);

        if (!res.ok) throw new Error('Erreur serveur lors du chargement des produits');
        allProducts = await res.json();
        displayProducts(allProducts);
      } catch (err) {
        console.error('Erreur produits:', err);
        if (productGrid) {
          productGrid.innerHTML = `<p style="color:red">${err.message}</p>`;
        }
      }
    }

    function displayProducts(list) {
      if (!productGrid) return;

      if (!Array.isArray(list) || list.length === 0) {
        productGrid.innerHTML = '<p>Aucun produit trouvé.</p>';
        return;
      }

      productGrid.innerHTML = '';

      list.forEach(prod => {
        const card = document.createElement('div');
        card.className = 'product-card';

        const priceText =
          prod.product_price != null
            ? `${Number(prod.product_price).toFixed(2)} $`
            : '—';

        const categoryText = prod.category_name || '';

        card.innerHTML = `
          <img src="${prod.image_url || './assets/img/default.png'}" alt="${prod.product_name}" />
          <h3>
            <a href="./productdetail.html?id=${prod.product_id}">
              ${prod.product_name}
            </a>
          </h3>
          <p>${categoryText}</p>
          <div class="price">${priceText}</div>
          <button class="btn btn-primary">Ajouter</button>
        `;

        productGrid.appendChild(card);
      });
    }
  </script>

</body>
</html>
